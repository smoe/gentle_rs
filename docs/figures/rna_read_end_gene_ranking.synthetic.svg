itle></circle><circle cx="912.58" cy="142" r="5" fill="#d1495b"><title>MDM4: -71 bp</title></circle><text x="178" y="181" text-anchor="end" font-family="sans-serif" font-size="13">FUS</text><line x1="190" x2="1156" y1="176" y2="176" stroke="#eee"/><circle cx="202.00" cy="176" r="5" fill="#6c7a89"><title>FUS: -8 bp</title></circle><circle cx="547.00" cy="176" r="5" fill="#2a9d8f"><title>FUS: -2 bp</title></circle><circle cx="1070.92" cy="176" r="5" fill="#d1495b"><title>FUS: 29 bp</title></circle><text x="178" y="215" text-anchor="end" font-family="sans-serif" font-size="13">ACTB</text><line x1="190" x2="1156" y1="210" y2="210" stroke="#eee"/><circle cx="202.00" cy="210" r="5" fill="#6c7a89"><title>ACTB: -8 bp</title></circle><circle cx="547.00" cy="210" r="5" fill="#2a9d8f"><title>ACTB: -2 bp</title></circle><circle cx="1015.50" cy="210" r="5" fill="#d1495b"><title>ACTB: -6 bp</title></circle></svg>
