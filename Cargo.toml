[package]
name = "GENtle"
authors = ["Magnus Manske <magnusmanske@googlemail.com>", "Steffen Möller <moeller@debian.org>"]
description = "Molecular biology workbench for sequence analysis, cloning design, genome evidence integration, and reproducible experimental planning"
keywords = ["plasmid", "vector", "primer", "biology", "pcr", "cloning"]
categories = ["science", "science::bioinformatics"]
repository = "https://github.com/smoe/gentle_rs/"
version.workspace = true
edition.workspace = true
default-run = "gentle"
build = "build.rs"

[lints.cargo]
# These executable names are established compatibility surfaces across scripts,
# containers, tests, documentation, and external agent integrations.
non_kebab_case_bins = "allow"

[workspace]
resolver = "3"
members = [
    "crates/gentle-benchmarks",
    "crates/gentle-engine",
    "crates/gentle-protocol",
    "crates/gentle-render",
    "crates/gentle-shell",
    "crates/gentle-gui",
]
exclude = ["packages/snapgene-reader"]

[workspace.package]
version = "0.1.0-internal.10"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
bio = "4.0.1"
egui = "0.36.1"
image = "0.25.10"
itertools = "0.15.0"
mlua = "0.12.0"
rayon = "1.12.0"
reqwest = "0.13.4"
rfd = "0.17.2"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.21.0"
svg = "0.18.0"
tempfile = "3.27.0"

[package.metadata.bundle]
identifier = "com.example.gentle"
icon = ["assets/icon.icns"]  # Path to your .icns file
resources = ["assets/", "docs/", "Credits.rtf"]      # Additional resources if needed
osx_info_plist_exts = ["Info.plist"]

[package.metadata.bundle.windows]
icon = ["assets/icon.ico"]


[[bin]]
name = "gentle"
path = "src/bin/gentle.rs"
required-features = ["desktop-gui"]

[[bin]]
name = "gentle_dna_viewer_repro"
path = "src/bin/gentle_dna_viewer_repro/main.rs"
required-features = ["desktop-gui"]

[[bin]]
name = "gentle_egui_window_repro"
path = "src/bin/gentle_egui_window_repro/main.rs"
required-features = ["desktop-gui"]

[[bin]]
name = "gentle_lua"
path = "src/bin/gentle_lua.rs"
required-features = ["lua-interface"]

[[bin]]
name = "gentle_js"
path = "src/bin/gentle_js.rs"
required-features = ["js-interface"]

[[bin]]
name = "gentle_cli"
path = "src/bin/gentle_cli.rs"

[[bin]]
name = "gentle_examples_docs"
path = "src/bin/gentle_examples_docs.rs"

[[bin]]
name = "gentle_mcp"
path = "src/bin/gentle_mcp.rs"

[[bin]]
name = "gentle_publication_report"
path = "src/bin/gentle_publication_report.rs"

[lib]
name = "gentle"

[features]
default = ["desktop-gui", "screenshot-capture"]
desktop-gui = [
    "dep:arboard",
    "dep:eframe",
    "dep:egui_commonmark",
    "dep:egui_extras",
    "dep:gentle-gui",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:rfd",
]
screenshot-capture = ["desktop-gui", "dep:screencapturekit"]
gui-profiler = ["desktop-gui", "dep:puffin", "dep:puffin_http"]
benchmark-support = []
gui-test-support = ["desktop-gui"]
snapshot-tests = ["gentle-render/snapshot-tests"]
js-interface = [
    "dep:deno_core",
    "dep:deno_error",
    "dep:rustyline",
    "dep:tokio",
]
lua-interface = ["dep:mlua", "dep:rustyline"]
script-interfaces = ["js-interface", "lua-interface"]

[dependencies]
gentle-engine = { path = "crates/gentle-engine" }
gentle-gui = { path = "crates/gentle-gui", optional = true }
gentle-protocol = { path = "crates/gentle-protocol" }
gentle-render = { path = "crates/gentle-render" }
gentle-shell = { path = "crates/gentle-shell" }
snapgene-reader = { path = "packages/snapgene-reader", features = ["gb-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
quick-xml = { version = "*", features = ["serialize"] }
bio = { workspace = true }
csv = "^1"
itertools = { workspace = true }
gb-io = { version = "0.9.0", features = ["serde"] }
svg = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }
arboard = { version = "3.6.1", optional = true }
eframe = { version = "0.36.1", features = [
	"accesskit",
	"default_fonts",
	"glow",
	"wayland",
	# "web_screen_reader",
	"x11",
	"persistence",
], optional = true }
egui_extras = { version = "0.36.1", features = ["all_loaders"], optional = true }
egui_commonmark = { version = "0.22.0", default-features = false, features = ["pulldown_cmark", "load-images"], optional = true }
image = { workspace = true, features = ["jpeg", "png"] }
resvg = "*"
rfd = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["blocking", "form", "json"] }
tempfile = { workspace = true }
flate2 = "1.0"
memchr = "2"
regex = "^1"
scraper = "0.27.0"
pulldown-cmark = "0.13.4"
ring = "0.17.14"
base64 = "*"
puffin = { version = "0.20.0", optional = true }
puffin_http = { version = "0.17.0", optional = true }

# For feature-gated JS/Lua shells
rustyline = { workspace = true, optional = true }
mlua = { workspace = true, optional = true, features = ["lua54", "vendored", "serde"] }
# Keep ICU data explicit because deno_core 0.408 no longer enables it by
# default. The compatible Temporal/ICU versions are selected by V8.
deno_core = { version = "0.411.0", optional = true, features = ["include_icu_data"] }
deno_error = { version = "=0.7.1", optional = true }
tokio = { version = "1.53.1", optional = true, features = ["rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"], optional = true }
screencapturekit = { version = "9.*", optional = true, features = ["macos_14_0"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.dev]
# Favor faster local iteration for the large GUI crate. Keep line-table debug
# info for stack traces, but avoid generating full dependency debuginfo on
# every edit/relink.
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = 'fat'
panic = 'abort'
codegen-units = 1
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 2

[profile.bench-audit]
inherits = "release"
lto = "thin"
codegen-units = 16
panic = "unwind"

[patch.crates-io]
egui_commonmark = { path = "vendor/egui_commonmark" }
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }
