name: Release Installers

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version label (need not exist for build-only validation)'
        required: true
        type: string
      candidate_sha:
        description: 'Full 40-character candidate commit SHA; never a branch name'
        required: true
        type: string
      publish:
        description: 'Publish after owner approval; tag must already point to candidate_sha'
        required: false
        type: boolean
        default: false
      linux_distribution:
        description: 'Linux artifact built and published by this workflow'
        required: false
        type: choice
        options:
          - tarball
        default: tarball

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/release-candidate.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      candidate_sha: ${{ inputs.candidate_sha || '' }}
      publish: ${{ inputs.publish || false }}

  build-installers:
    name: Build Package (${{ matrix.os }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            bundle_format: osx
            extension: dmg
            artifact_name: gentle-macos-installer
          - os: windows-latest
            platform: windows
            bundle_format: zip
            extension: zip
            artifact_name: gentle-windows-zip
          - os: ubuntu-24.04
            platform: linux
            bundle_format: tarball
            extension: tar.gz
            artifact_name: gentle-linux-tarball

    env:
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      EXPECTED_REVISION: ${{ needs.candidate.outputs.revision }}
      EXPECTED_LOCK_SHA256: ${{ needs.candidate.outputs.cargo_lock_sha256 }}
      WORKFLOW_REVISION: ${{ needs.candidate.outputs.workflow_revision }}
      CANDIDATE_MODE: ${{ needs.candidate.outputs.mode }}
      NATIVE_PROFILE: ${{ needs.candidate.outputs.native_profile }}
      NATIVE_TARGET_SUBDIR: ${{ needs.candidate.outputs.native_target_subdir }}
      CARGO_TARGET_DIR: target
      CARGO_BUILD_JOBS: "1"
      # Hosted release jobs are cold builds: incremental state cannot be reused.
      # Keep debug assertions through the dev profile, but omit line tables from
      # internal packages so the compiler and five staged binaries carry less data.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUST_MIN_STACK: 67108864

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.revision }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python for release receipts
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify immutable candidate identity
        shell: bash
        run: |
          python3 scripts/release_candidate.py verify
          test -f scripts/package_desktop.py
          case "$NATIVE_PROFILE:$NATIVE_TARGET_SUBDIR" in
            dev:debug|release:release) ;;
            *) echo "Missing or invalid native build profile; candidate must contain the profile-aware packaging helpers"; exit 1 ;;
          esac

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config perl time \
            libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libgbm-dev \
            libglib2.0-dev libgl1-mesa-dev libgtk-3-dev libnss3-dev libssl-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxinerama-dev libxkbcommon-dev libxi-dev libxrandr-dev

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install ImageMagick (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install imagemagick --no-progress -y

      - name: Generate Windows .ico from PNG
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          magick assets/icon.png -define icon:auto-resize=256,128,64,48,32,16 assets/icon.ico
          if (!(Test-Path "assets/icon.ico")) {
            throw "assets/icon.ico was not generated"
          }

      - name: Install cargo-bundle
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --locked

      - name: Build locked native binaries
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gentle-release-build.log"
          {
            echo "revision=$EXPECTED_REVISION platform=$RUNNER_OS profile=$NATIVE_PROFILE incremental=$CARGO_INCREMENTAL dev_debug=$CARGO_PROFILE_DEV_DEBUG"
            rustc --version --verbose
            cargo --version
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              free -h
              df -h .
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              sysctl hw.memsize
              vm_stat
              df -h .
            fi
          } 2>&1 | tee "$log"
          build=(cargo build --locked --profile "$NATIVE_PROFILE" -j1
            --bin gentle --bin gentle_cli --bin gentle_mcp
            --bin gentle_examples_docs --bin gentle_publication_report)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            build=(/usr/bin/time -v "${build[@]}")
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            build=(/usr/bin/time -l "${build[@]}")
          fi
          "${build[@]}" 2>&1 | tee -a "$log"

      - name: Retain release build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: release-build-log-${{ matrix.platform }}-${{ needs.candidate.outputs.revision }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gentle-release-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke published entrypoints
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/gentle${suffix}" --version
          "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/gentle_cli${suffix}" --help
          "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/gentle_mcp${suffix}" --help
          "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/gentle_examples_docs${suffix}" --help
          "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/gentle_publication_report${suffix}" --help
          git diff --exit-code -- Cargo.lock Cargo.toml

      - name: Build macOS bundle
        if: runner.os == 'macOS'
        run: cargo bundle --profile "$NATIVE_PROFILE" --bin gentle --format ${{ matrix.bundle_format }}

      - name: Inspect macOS bundle outputs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
          echo "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR} contents:"
          ls -la "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}"
          echo "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/bundle tree:"
          find "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/bundle" -maxdepth 4 -print || true
          if [[ ! -d "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/bundle/osx" ]]; then
            echo "Expected bundle directory ${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/bundle/osx after cargo bundle"
            exit 1
          fi

      - name: Inspect Windows build outputs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR"
          if (!(Test-Path "$env:CARGO_TARGET_DIR/$env:NATIVE_TARGET_SUBDIR")) {
            throw "$env:CARGO_TARGET_DIR/$env:NATIVE_TARGET_SUBDIR directory was not created"
          }
          Write-Host "$env:CARGO_TARGET_DIR/$env:NATIVE_TARGET_SUBDIR contents:"
          Get-ChildItem -Force "$env:CARGO_TARGET_DIR/$env:NATIVE_TARGET_SUBDIR"
          if (!(Test-Path "$env:CARGO_TARGET_DIR/$env:NATIVE_TARGET_SUBDIR/gentle.exe")) {
            throw "Expected Windows binary $env:CARGO_TARGET_DIR/$env:NATIVE_TARGET_SUBDIR/gentle.exe after cargo build"
          }

      - name: Collect installer path
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            bundle_dir="${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/bundle/osx"
            echo "runner.os=${{ runner.os }}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
            echo "bundle_dir=${bundle_dir}"
            if [[ ! -d "$bundle_dir" ]]; then
              echo "Bundle directory not found: $bundle_dir"
              exit 1
            fi
            echo "bundle_dir contents:"
            ls -la "$bundle_dir"

            echo "app bundle candidates:"
            find "$bundle_dir" -type d -name "*.app" -prune -print || true

            app_bundle="$(find "$bundle_dir" -type d -name "*.app" -prune -print | head -n 1)"
            if [[ -z "$app_bundle" ]]; then
              echo "No .app bundle found under $bundle_dir"
              exit 1
            fi
            echo "app_bundle=${app_bundle}"

            stage_dir="$(mktemp -d "$RUNNER_TEMP/gentle-dmg.XXXXXX")"
            echo "stage_dir=${stage_dir}"
            python3 scripts/package_desktop.py stage --platform macos --repo . \
              --binaries "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}" --tag "${RELEASE_TAG#refs/tags/}" \
              --app-bundle "$app_bundle" --destination "$stage_dir/$(basename "$app_bundle")"
            installer="${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/bundle/osx/gentle-${RELEASE_TAG#refs/tags/}.dmg"
            echo "installer=${installer}"
            hdiutil create \
              -volname "GENtle" \
              -srcfolder "$stage_dir" \
              -ov \
              -format UDZO \
              "$installer"
            echo "created installer:"
            ls -la "$installer"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            tag="${RELEASE_TAG#refs/tags/}"
            package="gentle-${tag}-linux-x64"
            stage_parent="$(mktemp -d "$RUNNER_TEMP/gentle-linux.XXXXXX")"
            stage="$stage_parent/$package"
            python3 scripts/package_desktop.py stage --platform linux --repo . \
              --binaries "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}" --tag "$tag" --destination "$stage"
            out_dir="${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/bundle/tar"
            mkdir -p "$out_dir"
            installer="$out_dir/${package}.tar.gz"
            tar -czf "$installer" -C "$stage_parent" "$package"
          else
            tag="${RELEASE_TAG#refs/tags/}"
            package="gentle-${tag}"
            stage_parent="$(mktemp -d "$RUNNER_TEMP/gentle-windows.XXXXXX")"
            python3 scripts/package_desktop.py stage --platform windows --repo . \
              --binaries "${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}" --tag "$tag" \
              --destination "$stage_parent/$package"
            out_dir="${CARGO_TARGET_DIR}/${NATIVE_TARGET_SUBDIR}/bundle/zip"
            mkdir -p "$out_dir"
            installer="$out_dir/gentle-${RELEASE_TAG#refs/tags/}.zip"
            echo "installer=${installer}"
            python3 -c 'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", sys.argv[2], sys.argv[3])' \
              "${installer%.zip}" "$stage_parent" "$package"
            echo "created installer:"
            ls -la "$installer"
          fi
          echo "installer_path=$installer" >> "$GITHUB_OUTPUT"
          echo "Installer: $installer"

      - name: Smoke test macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          installer="${{ steps.collect.outputs.installer_path }}"
          mount_point="$RUNNER_TEMP/gentle_dmg_mount"
          mkdir -p "$mount_point"
          hdiutil attach "$installer" -mountpoint "$mount_point" -nobrowse -quiet
          trap 'hdiutil detach "$mount_point" -quiet' EXIT
          app_path="$(find "$mount_point" -maxdepth 2 -name '*.app' | head -n 1)"
          if [[ -z "$app_path" ]]; then
            echo "No .app bundle found in mounted DMG"
            exit 1
          fi
          test -f "$app_path/Contents/Info.plist"
          python3 scripts/package_desktop.py smoke --platform macos --root "$app_path" \
            --revision "$EXPECTED_REVISION" --checkout "$GITHUB_WORKSPACE"

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = "${{ steps.collect.outputs.installer_path }}"
          $resolvedInstaller = (Resolve-Path $installer).Path
          if (-not $resolvedInstaller) {
            throw "Could not resolve installer path: $installer"
          }
          $installerItem = Get-Item $resolvedInstaller
          Write-Host "installer=$resolvedInstaller"
          Write-Host "installer_size_bytes=$($installerItem.Length)"
          $hash = (Get-FileHash -Path $resolvedInstaller -Algorithm SHA256).Hash
          Write-Host "installer_sha256=$hash"

          $extract = Join-Path $env:RUNNER_TEMP "gentle_zip_extract"
          if (Test-Path $extract) {
            Remove-Item -Recurse -Force $extract
          }
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -Path $resolvedInstaller -DestinationPath $extract -Force

          $package = Join-Path $extract ("gentle-" + $env:RELEASE_TAG.Replace("refs/tags/", ""))
          python scripts/package_desktop.py smoke --platform windows --root "$package" `
            --revision "$env:EXPECTED_REVISION" --checkout "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "Extracted Windows package smoke failed" }

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          extract="$(mktemp -d "$RUNNER_TEMP/gentle-linux-smoke.XXXXXX")"
          tar -xzf "${{ steps.collect.outputs.installer_path }}" -C "$extract"
          package="$extract/gentle-${RELEASE_TAG#refs/tags/}-linux-x64"
          python3 scripts/package_desktop.py smoke --platform linux --root "$package" \
            --revision "$EXPECTED_REVISION" --checkout "$GITHUB_WORKSPACE"

      - name: Normalize installer filename
        id: normalize
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ runner.arch }}
          INSTALLER_PATH: ${{ steps.collect.outputs.installer_path }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#refs/tags/}"
          arch="$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')"
          profile_suffix=""
          if [[ "$NATIVE_PROFILE" == "dev" ]]; then profile_suffix="-dev"; fi
          out_dir="dist"
          mkdir -p "$out_dir"
          out_path="$out_dir/gentle-${tag}-${{ matrix.platform }}-${arch}${profile_suffix}.${{ matrix.extension }}"
          cp "${{ steps.collect.outputs.installer_path }}" "$out_path"
          echo "output_path=$out_path" >> "$GITHUB_OUTPUT"
          python3 scripts/release_candidate.py verify
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from scripts.package_desktop import BINARIES
          tag = os.environ["RELEASE_TAG"].removeprefix("refs/tags/")
          platform = os.environ["PACKAGE_PLATFORM"]
          arch = os.environ["PACKAGE_ARCH"].lower()
          record = {
              "schema": "gentle.release_build.v1", "tag": tag,
              "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "platform": platform, "arch": arch, "features": [],
              "default_features": True, "binaries": list(BINARIES),
              "profile": os.environ["NATIVE_PROFILE"],
              "incremental": os.environ["CARGO_INCREMENTAL"] != "0",
              "debug": int(os.environ["CARGO_PROFILE_DEV_DEBUG"]),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              "cargo_lock_sha256": hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest(),
              "workflow_revision": os.environ["WORKFLOW_REVISION"],
              "mode": os.environ["CANDIDATE_MODE"],
          }
          with pathlib.Path(os.environ["INSTALLER_PATH"]).open("rb") as stream:
              record["artifact_sha256"] = hashlib.file_digest(stream, "sha256").hexdigest()
          pathlib.Path(f"dist/gentle-{tag}-{platform}-{arch}.build.json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.candidate.outputs.revision }}
          path: |
            ${{ steps.normalize.outputs.output_path }}
            dist/*.build.json
          if-no-files-found: error

  collect-packages:
    name: Validate and retain candidate packages
    runs-on: ubuntu-latest
    needs: [candidate, build-installers]
    env:
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      EXPECTED_REVISION: ${{ needs.candidate.outputs.revision }}
      EXPECTED_LOCK_SHA256: ${{ needs.candidate.outputs.cargo_lock_sha256 }}
      WORKFLOW_REVISION: ${{ needs.candidate.outputs.workflow_revision }}
      CANDIDATE_MODE: ${{ needs.candidate.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.revision }}
      - name: Set up Python for release receipts
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Show downloaded files
        run: |
          find dist -type f | sort

      - name: Validate receipts against the selected candidate
        run: |
          python3 scripts/release_candidate.py collect --artifacts dist \
            --output "dist/release-meta/gentle-${RELEASE_TAG}-release-attributes.json"

      - name: Retain packaging metadata
        uses: actions/upload-artifact@v6
        with:
          name: release-metadata-${{ needs.candidate.outputs.revision }}
          path: dist/release-meta/*.json
          if-no-files-found: error

  publish-release:
    name: Publish approved GitHub Release
    runs-on: ubuntu-latest
    needs: [candidate, collect-packages]
    if: >-
      needs.candidate.outputs.publish == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
       (github.event_name == 'release' && github.event.action == 'published'))
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      EXPECTED_REVISION: ${{ needs.candidate.outputs.revision }}
      EXPECTED_LOCK_SHA256: ${{ needs.candidate.outputs.cargo_lock_sha256 }}
      WORKFLOW_REVISION: ${{ needs.candidate.outputs.workflow_revision }}
      CANDIDATE_MODE: publish
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Recheck tag and package receipts immediately before publication
        run: python3 scripts/release_candidate.py collect --artifacts dist
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.candidate.outputs.tag }}
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.build.json
            dist/**/*-release-attributes.json
          fail_on_unmatched_files: true
          generate_release_notes: true
