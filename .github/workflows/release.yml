name: Release Installers

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (example: v0.1.0)'
        required: true
        type: string
      linux_distribution:
        description: 'Linux artifact built and published by this workflow'
        required: false
        type: choice
        options:
          - tarball
        default: tarball

permissions:
  contents: write

concurrency:
  group: release-installers-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-installers:
    name: Build Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            bundle_format: osx
            extension: dmg
            artifact_name: gentle-macos-installer
          - os: windows-latest
            platform: windows
            bundle_format: zip
            extension: zip
            artifact_name: gentle-windows-zip
          - os: ubuntu-24.04
            platform: linux
            bundle_format: tarball
            extension: tar.gz
            artifact_name: gentle-linux-tarball

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      CARGO_TARGET_DIR: target
      RUST_MIN_STACK: 67108864

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python for release receipts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag and package identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tomllib
          tag = os.environ["RELEASE_TAG"].removeprefix("refs/tags/")
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          version = manifest["workspace"]["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tagged = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          if revision != tagged:
              raise SystemExit("Checkout does not match the requested tag commit")
          PY

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config perl \
            libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libgbm-dev \
            libglib2.0-dev libgl1-mesa-dev libgtk-3-dev libnss3-dev libssl-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxinerama-dev libxkbcommon-dev libxi-dev libxrandr-dev

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install ImageMagick (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install imagemagick --no-progress -y

      - name: Generate Windows .ico from PNG
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          magick assets/icon.png -define icon:auto-resize=256,128,64,48,32,16 assets/icon.ico
          if (!(Test-Path "assets/icon.ico")) {
            throw "assets/icon.ico was not generated"
          }

      - name: Install cargo-bundle
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --locked

      - name: Build locked release binaries
        run: cargo build --locked --release --features script-interfaces --bins

      - name: Smoke published entrypoints
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          "${CARGO_TARGET_DIR}/release/gentle${suffix}" --version
          "${CARGO_TARGET_DIR}/release/gentle_cli${suffix}" --help
          "${CARGO_TARGET_DIR}/release/gentle_mcp${suffix}" --help
          "${CARGO_TARGET_DIR}/release/gentle_js${suffix}" --version
          "${CARGO_TARGET_DIR}/release/gentle_lua${suffix}" --version
          "${CARGO_TARGET_DIR}/release/gentle_examples_docs${suffix}" --help
          "${CARGO_TARGET_DIR}/release/gentle_publication_report${suffix}" --help
          git diff --exit-code -- Cargo.lock Cargo.toml

      - name: Build macOS bundle
        if: runner.os == 'macOS'
        run: cargo bundle --release --features script-interfaces --bin gentle --format ${{ matrix.bundle_format }}

      - name: Inspect macOS bundle outputs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
          echo "${CARGO_TARGET_DIR}/release contents:"
          ls -la "${CARGO_TARGET_DIR}/release"
          echo "${CARGO_TARGET_DIR}/release/bundle tree:"
          find "${CARGO_TARGET_DIR}/release/bundle" -maxdepth 4 -print || true
          if [[ ! -d "${CARGO_TARGET_DIR}/release/bundle/osx" ]]; then
            echo "Expected bundle directory ${CARGO_TARGET_DIR}/release/bundle/osx after cargo bundle"
            exit 1
          fi

      - name: Inspect Windows build outputs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR"
          if (!(Test-Path "$env:CARGO_TARGET_DIR/release")) {
            throw "$env:CARGO_TARGET_DIR/release directory was not created"
          }
          Write-Host "$env:CARGO_TARGET_DIR/release contents:"
          Get-ChildItem -Force "$env:CARGO_TARGET_DIR/release"
          if (!(Test-Path "$env:CARGO_TARGET_DIR/release/gentle.exe")) {
            throw "Expected Windows binary $env:CARGO_TARGET_DIR/release/gentle.exe after cargo build"
          }

      - name: Collect installer path
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            bundle_dir="${CARGO_TARGET_DIR}/release/bundle/osx"
            echo "runner.os=${{ runner.os }}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
            echo "bundle_dir=${bundle_dir}"
            if [[ ! -d "$bundle_dir" ]]; then
              echo "Bundle directory not found: $bundle_dir"
              exit 1
            fi
            echo "bundle_dir contents:"
            ls -la "$bundle_dir"

            echo "app bundle candidates:"
            find "$bundle_dir" -type d -name "*.app" -prune -print || true

            app_bundle="$(find "$bundle_dir" -type d -name "*.app" -prune -print | head -n 1)"
            if [[ -z "$app_bundle" ]]; then
              echo "No .app bundle found under $bundle_dir"
              exit 1
            fi
            echo "app_bundle=${app_bundle}"

            stage_dir="$RUNNER_TEMP/gentle_dmg_stage"
            echo "stage_dir=${stage_dir}"
            rm -rf "$stage_dir"
            mkdir -p "$stage_dir"
            cp -R "$app_bundle" "$stage_dir/"
            installer="${CARGO_TARGET_DIR}/release/bundle/osx/gentle-${RELEASE_TAG#refs/tags/}.dmg"
            echo "installer=${installer}"
            hdiutil create \
              -volname "GENtle" \
              -srcfolder "$stage_dir" \
              -ov \
              -format UDZO \
              "$installer"
            echo "created installer:"
            ls -la "$installer"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            tag="${RELEASE_TAG#refs/tags/}"
            package="gentle-${tag}-linux-x64"
            stage_parent="$(mktemp -d "$RUNNER_TEMP/gentle-linux.XXXXXX")"
            stage="$stage_parent/$package"
            mkdir -p "$stage/bin" dist
            for binary in gentle gentle_cli gentle_mcp gentle_js gentle_lua gentle_examples_docs gentle_publication_report; do
              install -m755 "${CARGO_TARGET_DIR}/release/$binary" "$stage/bin/$binary"
              ldd "$stage/bin/$binary" >> "$stage/runtime-libraries.txt"
            done
            if grep -q 'not found' "$stage/runtime-libraries.txt"; then
              echo "Unresolved runtime library in Linux package"
              exit 1
            fi
            # Include only tracked resources, never a developer's downloaded caches.
            git ls-files -z -- assets icons docs test_files integrations/python \
              data/resources/affymetrix/platform_registry.json README.md CONTRIBUTING.md copyright \
              | tar --null -T - -cf - | tar -xf - -C "$stage"
            cp docs/linux_tarball.md "$stage/START-HERE.md"
            git rev-parse HEAD > "$stage/REVISION"
            printf '%s\n' "$tag" > "$stage/VERSION"
            (
              cd "$stage"
              find . -type f ! -name SHA256SUMS -print0 | sort -z \
                | xargs -0 sha256sum > SHA256SUMS
            )
            out_dir="${CARGO_TARGET_DIR}/release/bundle/tar"
            mkdir -p "$out_dir"
            installer="$out_dir/${package}.tar.gz"
            tar -czf "$installer" -C "$stage_parent" "$package"
          else
            exe_path="${CARGO_TARGET_DIR}/release/gentle.exe"
            echo "runner.os=${{ runner.os }}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
            echo "exe_path=${exe_path}"
            if [[ ! -f "$exe_path" ]]; then
              echo "Windows binary not found: $exe_path"
              exit 1
            fi
            out_dir="${CARGO_TARGET_DIR}/release/bundle/zip"
            mkdir -p "$out_dir"
            installer="$out_dir/gentle-${RELEASE_TAG#refs/tags/}.zip"
            echo "installer=${installer}"
            powershell -NoProfile -Command "Compress-Archive -Path '$exe_path' -DestinationPath '$installer' -Force"
            echo "created installer:"
            ls -la "$installer"
          fi
          echo "installer_path=$installer" >> "$GITHUB_OUTPUT"
          echo "Installer: $installer"

      - name: Smoke test macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          installer="${{ steps.collect.outputs.installer_path }}"
          mount_point="$RUNNER_TEMP/gentle_dmg_mount"
          mkdir -p "$mount_point"
          hdiutil attach "$installer" -mountpoint "$mount_point" -nobrowse -quiet
          app_path="$(find "$mount_point" -maxdepth 2 -name '*.app' | head -n 1)"
          if [[ -z "$app_path" ]]; then
            echo "No .app bundle found in mounted DMG"
            exit 1
          fi
          test -f "$app_path/Contents/Info.plist"
          hdiutil detach "$mount_point" -quiet

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = "${{ steps.collect.outputs.installer_path }}"
          $resolvedInstaller = (Resolve-Path $installer).Path
          if (-not $resolvedInstaller) {
            throw "Could not resolve installer path: $installer"
          }
          $installerItem = Get-Item $resolvedInstaller
          Write-Host "installer=$resolvedInstaller"
          Write-Host "installer_size_bytes=$($installerItem.Length)"
          $hash = (Get-FileHash -Path $resolvedInstaller -Algorithm SHA256).Hash
          Write-Host "installer_sha256=$hash"

          $extract = Join-Path $env:RUNNER_TEMP "gentle_zip_extract"
          if (Test-Path $extract) {
            Remove-Item -Recurse -Force $extract
          }
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -Path $resolvedInstaller -DestinationPath $extract -Force

          $exe = Get-ChildItem -Path $extract -Filter gentle.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "No gentle.exe found after ZIP extraction"
          }
          if ($exe.Length -le 0) {
            throw "Extracted gentle.exe is empty"
          }
          Write-Host "zip_extracted_exe=$($exe.FullName)"
          Write-Host "zip_extracted_exe_size_bytes=$($exe.Length)"

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          extract="$(mktemp -d "$RUNNER_TEMP/gentle-linux-smoke.XXXXXX")"
          tar -xzf "${{ steps.collect.outputs.installer_path }}" -C "$extract"
          package="$extract/gentle-${RELEASE_TAG#refs/tags/}-linux-x64"
          test "$(cat "$package/REVISION")" = "$(git rev-parse HEAD)"
          cd "$package"
          sha256sum -c SHA256SUMS
          ./bin/gentle --version
          ./bin/gentle_cli capabilities
          ./bin/gentle_mcp --help
          ./bin/gentle_js --version
          ./bin/gentle_lua --version
          ./bin/gentle_examples_docs --help
          ./bin/gentle_publication_report --help
          test -s assets/genomes.json
          test -s docs/tutorial/manifest.json

      - name: Normalize installer filename
        id: normalize
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#refs/tags/}"
          arch="$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')"
          out_dir="dist"
          mkdir -p "$out_dir"
          out_path="$out_dir/gentle-${tag}-${{ matrix.platform }}-${arch}.${{ matrix.extension }}"
          cp "${{ steps.collect.outputs.installer_path }}" "$out_path"
          echo "output_path=$out_path" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          tag = os.environ["RELEASE_TAG"].removeprefix("refs/tags/")
          platform = os.environ["PACKAGE_PLATFORM"]
          arch = os.environ["PACKAGE_ARCH"].lower()
          record = {
              "schema": "gentle.release_build.v1", "tag": tag,
              "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "platform": platform, "arch": arch, "features": ["script-interfaces"],
              "profile": "release",
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "cargo_lock_sha256": hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest(),
          }
          pathlib.Path(f"dist/gentle-{tag}-{platform}-{arch}.build.json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ steps.normalize.outputs.output_path }}
            dist/*.build.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-installers
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Set up Python for release receipts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files
        run: |
          find dist -type f | sort

      - name: Write release attributes
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#refs/tags/}"
          out_dir="dist/release-meta"
          mkdir -p "$out_dir"
          out_file="$out_dir/gentle-${tag}-release-attributes.json"
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          tag = os.environ["RELEASE_TAG"].removeprefix("refs/tags/")
          receipts = [json.loads(path.read_text()) for path in pathlib.Path("dist").rglob("*.build.json")]
          if len(receipts) != 3 or {r["platform"] for r in receipts} != {"linux", "macos", "windows"}:
              raise SystemExit("Expected Linux, macOS and Windows build receipts")
          revisions = {r["revision"] for r in receipts}
          lock_hashes = {r["cargo_lock_sha256"] for r in receipts}
          if len(revisions) != 1 or len(lock_hashes) != 1 or any(r["tag"] != tag for r in receipts):
              raise SystemExit("Platform packages are not bound to one tag/revision")
          artifacts = []
          for pattern in ("*.dmg", "*.zip", "*.tar.gz"):
              paths = list(pathlib.Path("dist").rglob(pattern))
              if len(paths) != 1:
                  raise SystemExit(f"Expected one release artifact for {pattern}")
              path = paths[0]
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              artifacts.append({"name": path.name, "sha256": digest, "bytes": path.stat().st_size})
          record = {
              "schema": "gentle.release_attributes.v1", "tag": tag,
              "revision": revisions.pop(), "linux_distribution": "tarball",
              "cargo_lock_sha256": lock_hashes.pop(),
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "artifacts": artifacts,
          }
          pathlib.Path(f"dist/release-meta/gentle-{tag}-release-attributes.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
          echo "release_attributes=$out_file"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.build.json
            dist/release-meta/*.json
          fail_on_unmatched_files: true
          generate_release_notes: true
